{% extends "base.html" %}
{% block title %}Explore | PHANTX{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px; padding: 10px;">
    
    <!-- SEARCH BAR -->
    <div class="search-container">
        <form action="/search" method="GET">
            <input type="text" name="q" class="search-input" placeholder="Search creators, #tags..." required>
        </form>
    </div>

    <h2 style="margin-bottom: 15px; color: var(--text-primary); padding-left: 5px;">Discover</h2>

    <!-- EDGE TO EDGE GRID -->
    <div class="explore-grid-container">
        {% for post in posts %}
            <!-- Linking directly to Single Post View -->
            <a href="/post/{{ post.id }}" class="explore-grid-item">
                {% if post.category == 'Video' %}
                    <video src="{{ post.filename }}" style="width: 100%; height: 100%; object-fit: cover;" muted loop autoplay playsinline></video>
                {% else %}
                    <img src="{{ post.filename }}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
                {% endif %}
            </a>
        {% endfor %}
    </div>

</div>
{% endblock %}
