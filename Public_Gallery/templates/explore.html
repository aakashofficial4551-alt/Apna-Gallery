{% extends "base.html" %}
{% block title %}Explore | PHANTX{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px; padding: 10px;">
    
    <h2 style="margin-bottom: 15px; color: var(--text-primary);">Explore</h2>

    <!-- 💥 EDGE TO EDGE GRID 💥 -->
    <div class="explore-grid-container">
        {% for post in posts %}
            <!-- 💥 URL jumps directly to the post in feed via anchor #post-ID 💥 -->
            <a href="{{ url_for('feed') }}#post-{{ post.id }}" class="explore-grid-item">
                {% if post.category == 'Video' %}
                    <video src="{{ post.filename }}" style="width: 100%; height: 100%; object-fit: cover;"></video>
                {% else %}
                    <img src="{{ post.filename }}" loading="lazy">
                {% endif %}
            </a>
        {% endfor %}
    </div>

</div>
{% endblock %}
