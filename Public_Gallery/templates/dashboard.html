<!DOCTYPE html>
<html lang="en">
<head>
    <title>HQ Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>SOCHO KYA <span>HOGA</span></h1>
        <div class="nav-links">
            <span>Agent {{ session.username }}</span>
            {% if session.is_registered %}<a href="/profile">My Profile</a>{% endif %}
            <a href="/logout">Logout</a>
        </div>
    </header>

    <div class="container" style="display: flex; gap: 40px; justify-content: center; margin-top: 100px;">
        <a href="/gallery/Photo" class="dash-card" style="width: 400px; height: 300px; background: linear-gradient(135deg, rgba(229,9,20,0.2), transparent);">
            <h2 style="font-size: 3em;">📂 THE VAULT</h2>
            <p>Access Photos, Videos & Docs</p>
        </a>
        <a href="/games" class="dash-card" style="width: 400px; height: 300px; background: linear-gradient(135deg, rgba(0,229,255,0.2), transparent); border-color: #00e5ff;">
            <h2 style="font-size: 3em; color: #00e5ff;">🎮 THE ARCADE</h2>
            <p>Play Exclusive Games</p>
        </a>
    </div>
</body>
</html>
