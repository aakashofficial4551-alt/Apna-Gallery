<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HQ Dashboard | SOCHO KYA HOGA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <audio id="click-sound" src="https://actions.google.com/sounds/v1/ui/button_click.ogg" preload="auto"></audio>
    <audio id="mascot-sound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg" preload="auto"></audio>

    <header>
        <h1>SOCHO KYA <span>HOGA</span></h1>
        <div class="nav-links">
            <span role="text">Agent: {{ session.username }}</span>
            <a href="{{ url_for('profile') }}">👤 My Profile</a>
            <a href="{{ url_for('logout') }}">🚪 Logout</a>
        </div>
    </header>

    <div class="container">
        <a href="{{ url_for('admin') }}" class="admin-banner" style="background: var(--accent-dark); color: #fff; padding: 22px; text-align: center; border-radius: var(--radius-md); text-decoration: none; display: block; font-size: 1.4rem; font-weight: 800; margin-bottom: 35px; box-shadow: var(--shadow-lg); transition: var(--transition);">
            🛠️ ADMIN APPROVAL PANEL (Click Here) 🛠️
        </a>

        <h2 style="text-align: center; color: var(--accent-dark); font-weight: 800; margin-bottom: 30px; font-size: 1.8rem;">VAULT CATEGORIES</h2>
        <div class="grid-5">
            <a href="{{ url_for('gallery', category='Photo') }}" class="card">
                <h2>📸 Photo</h2>
            </a>
            <a href="{{ url_for('gallery', category='Video') }}" class="card">
                <h2>🎥 Video</h2>
            </a>
            <a href="{{ url_for('gallery', category='Music') }}" class="card">
                <h2>🎵 Music</h2>
            </a>
            <a href="{{ url_for('gallery', category='Document') }}" class="card">
                <h2>📄 Document</h2>
            </a>
            <a href="{{ url_for('gallery', category='Shayari') }}" class="card" style="border-color: #ff9800; color: #ff9800;">
                <h2>✍️ Shayari</h2>
            </a>
            <div class="card" style="border-color: #9d4edd; color: #9d4edd; cursor: pointer;" onclick="askMystery()" role="button" tabindex="0">
                <h2>🔒 Mystery</h2>
            </div>
        </div>

        <a href="{{ url_for('games') }}" style="background: linear-gradient(45deg, var(--accent), var(--accent-dark)); border-radius: var(--radius-md); padding: 35px; text-align: center; text-decoration: none; color: #fff; display: block; font-size: 2rem; font-weight: 800; transition: var(--transition); box-shadow: var(--shadow-lg);">
            🎮 ENTER ARCADE ZONE
        </a>
    </div>

    <!-- ALWAYS VISIBLE MASCOT -->
    <div id="mascot-widget" onclick="toggleAI()" role="button" aria-label="Toggle AI Assistant" tabindex="0">
        <div class="mascot-bubble">Talk to A.I. 🤖</div>
        <img id="ff-mascot" 
             src="{{ url_for('static', filename='mascot/cartoon_ff.gif') }}" 
             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/4712/4712010.png';"
             alt="FreeFire Mascot">
    </div>

    <!-- AI CHAT BOX -->
    <div class="ai-chat-box" id="ai-chat" aria-hidden="true">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--bg-primary); padding-bottom:12px; margin-bottom:12px;">
            <h3 style="margin:0; color:var(--accent-dark); font-size:1.1rem;">VAULT A.I.</h3>
            <button type="button" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold; font-size:1.2rem;" onclick="toggleAI()" aria-label="Close AI Chat">✖</button>
        </div>
        <div class="ai-messages" id="ai-messages" role="log">
            <div class="bot">Namaste! Dashboard par aapka swagat hai. Kahiye?</div>
        </div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="ai-input" placeholder="Type message..." autocomplete="off">
            <button type="button" class="btn" style="width: auto; padding: 10px 16px;" onclick="sendAI()">➤</button>
        </div>
    </div>

    <form id="mystery-form" action="{{ url_for('mystery') }}" method="POST" style="display:none;">
        <input type="hidden" name="passcode" id="mystery-pass">
    </form>
    
    <script>
        document.querySelectorAll('a, .card').forEach(item => {
            item.addEventListener('click', () => { 
                const sound = document.getElementById('click-sound');
                if (sound) sound.play().catch(() => {}); 
            });
        });

        function askMystery() {
            const sound = document.getElementById('click-sound');
            if (sound) sound.play().catch(() => {});
            let pass = prompt("CLASSIFIED AREA: Enter Secret Code:");
            if (pass) { 
                document.getElementById('mystery-pass').value = pass; 
                document.getElementById('mystery-form').submit(); 
            }
        }

        function toggleAI() { 
            const mascotSound = document.getElementById('mascot-sound');
            if (mascotSound) mascotSound.play().catch(() => {});
            let chatBox = document.getElementById('ai-chat'); 
            if (chatBox) {
                let isVisible = chatBox.style.display === 'block';
                chatBox.style.display = isVisible ? 'none' : 'block';
                chatBox.setAttribute('aria-hidden', isVisible ? 'true' : 'false');
            }
        }
        
        function sendAI() {
            const clickSound = document.getElementById('click-sound');
            if (clickSound) clickSound.play().catch(() => {});
            let input = document.getElementById('ai-input');
            let msgs = document.getElementById('ai-messages');
            if (!input || !input.value.trim()) return;
            
            let userText = input.value.trim();
            let userDiv = document.createElement('div');
            userDiv.className = 'user';
            userDiv.textContent = userText;
            msgs.appendChild(userDiv);
            
            input.value = ''; 
            msgs.scrollTop = msgs.scrollHeight;
            
            fetch("{{ url_for('ai_endpoint') }}", { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({query: userText}) 
            })
            .then(res => res.json())
            .then(data => {
                let botDiv = document.createElement('div');
                botDiv.className = 'bot';
                botDiv.textContent = data.reply;
                msgs.appendChild(botDiv);
                msgs.scrollTop = msgs.scrollHeight;
            })
            .catch(() => {
                let errDiv = document.createElement('div');
                errDiv.className = 'bot';
                errDiv.style.color = 'var(--danger)';
                errDiv.textContent = 'A.I. service is currently offline.';
                msgs.appendChild(errDiv);
                msgs.scrollTop = msgs.scrollHeight;
            });
        }

        const aiInput = document.getElementById('ai-input');
        if (aiInput) {
            aiInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendAI();
                }
            });
        }
    </script>
</body>
</html>
