<!DOCTYPE html>
<html lang="en">
<head>
    <title>HQ Dashboard | Sky Blue</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%); color: #333; margin: 0; padding: 0; min-height: 100vh;}
        header { text-align: center; padding: 20px; background: #fff; border-bottom: 3px solid #00b4d8; box-shadow: 0 5px 15px rgba(0,180,216,0.2);}
        .nav-links { margin-top: 10px; }
        .nav-links a { color: #0077b6; margin: 0 15px; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 20px; transition: 0.3s;}
        .nav-links a:hover { background: #00b4d8; color: white; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .grid-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;}
        
        .card { background: #fff; height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; border: 2px solid #b2ebf2; text-decoration: none; color: #0077b6; transition: 0.4s; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-8px); border-color: #00b4d8; box-shadow: 0 15px 30px rgba(0,180,216,0.3); background: #f0fcfd; }
        .card h2 { margin: 0; font-size: 1.6em; }
        
        .admin-banner { background: #0077b6; color: #fff; padding: 20px; text-align: center; border-radius: 10px; text-decoration: none; display: block; font-size: 1.5em; font-weight: 800; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,119,182,0.4); transition:0.3s;}
        .admin-banner:hover { background: #023e8a; transform: scale(1.02);}

        .games-banner { background: linear-gradient(45deg, #00b4d8, #0077b6); border-radius: 15px; padding: 30px; text-align: center; text-decoration: none; color: white; display: block; font-size: 2em; font-weight: 800; transition: 0.4s; box-shadow: 0 10px 20px rgba(0,180,216,0.4);}
        .games-banner:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <!-- UI Sound Effect -->
    <audio id="click-sound" src="https://actions.google.com/sounds/v1/ui/button_click.ogg"></audio>

    <header>
        <h1 style="color:#0077b6; letter-spacing: 3px;">SOCHO KYA HOGA</h1>
        <div class="nav-links">
            <span style="color:#555; font-weight:bold;">Agent {{ session.username }}</span>
            <a href="/profile">👤 My Profile</a>
            <a href="/logout">🚪 Logout</a>
        </div>
    </header>

    <div class="container">
        <!-- HUGE ADMIN BUTTON SO YOU NEVER MISS IT -->
        <a href="/admin" class="admin-banner">🛠️ ADMIN APPROVAL PANEL (Click Here) 🛠️</a>

        <h2 style="text-align: center; color: #023e8a; font-weight: 800; margin-bottom: 30px;">VAULT CATEGORIES</h2>
        <div class="grid-5">
            <a href="/gallery/Photo" class="card"><h2>📸 Photo</h2></a>
            <a href="/gallery/Video" class="card"><h2>🎥 Video</h2></a>
            <a href="/gallery/Music" class="card"><h2>🎵 Music</h2></a>
            <a href="/gallery/Document" class="card"><h2>📄 Document</h2></a>
            <div class="card" style="border-color: #9d4edd; color: #9d4edd;" onclick="askMystery()">
                <h2>🔒 Mystery</h2>
            </div>
        </div>

        <a href="/games" class="games-banner">🎮 ENTER ARCADE ZONE</a>
    </div>

    <form id="mystery-form" action="/mystery" method="POST" style="display:none;"><input type="hidden" name="passcode" id="mystery-pass"></form>
    
    <script>
        // Add sound to all clicks
        document.querySelectorAll('a, .card').forEach(item => {
            item.addEventListener('click', () => { document.getElementById('click-sound').play(); });
        });

        function askMystery() {
            document.getElementById('click-sound').play();
            let pass = prompt("CLASSIFIED AREA: Enter Secret Code:");
            if (pass) { document.getElementById('mystery-pass').value = pass; document.getElementById('mystery-form').submit(); }
        }
    </script>
</body>
</html>
