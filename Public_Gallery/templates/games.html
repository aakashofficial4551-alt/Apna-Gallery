<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arcade | Snake</title>
    <style>
        body { background: #000; color: #00e5ff; font-family: monospace; text-align: center; padding-top: 50px; }
        canvas { border: 2px solid #00e5ff; background: #111; box-shadow: 0 0 20px rgba(0,229,255,0.3); }
        .btn { background: #00e5ff; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 20px; text-decoration: none; display: inline-block;}
    </style>
</head>
<body>
    <h1>NEON SNAKE ARCADE</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Use Arrow Keys to Move</p>
    <a href="/dashboard" class="btn">Back to Dashboard</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let snake = []; snake[0] = { x: 9 * box, y: 10 * box };
        let food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
        let score = 0; let d;

        document.addEventListener("keydown", direction);
        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if (event.keyCode == 38 && d != "DOWN") d = "UP";
            else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if (event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i == 0 ? "#00e5ff" : "#0088ff";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000"; ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }
            ctx.fillStyle = "#e50914"; ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x; let snakeY = snake[0].y;
            if (d == "LEFT") snakeX -= box; if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box; if (d == "DOWN") snakeY += box;

            if (snakeX == food.x && snakeY == food.y) {
                score++;
                food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
            } else { snake.pop(); }

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game); alert("GAME OVER! Score: " + score); location.reload();
            }
            snake.unshift(newHead);
            ctx.fillStyle = "white"; ctx.font = "20px monospace"; ctx.fillText("Score: " + score, box, 1.5 * box);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) { if (head.x == array[i].x && head.y == array[i].y) return true; }
            return false;
        }
        let game = setInterval(draw, 100);
    </script>
</body>
</html>
