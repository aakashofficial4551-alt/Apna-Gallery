<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arcade | Sky Blue Edition</title>
    <style>
        body { background: #e0f7fa; color: #023e8a; font-family: monospace; text-align: center; margin: 0; padding-top: 30px;}
        h1 { font-size: 2.5em; margin-bottom: 5px;}
        .level-text { font-size: 1.5em; font-weight: bold; color: #e50914; margin-bottom: 15px;}
        canvas { border: 5px solid #00b4d8; background: #fff; box-shadow: 0 10px 30px rgba(0,180,216,0.3); border-radius:10px; display:block; margin: 0 auto;}
        .btn { background: #0077b6; color: #fff; border: none; padding: 12px 25px; cursor: pointer; text-decoration: none; font-size:1.2em; border-radius:8px; font-weight:bold; margin-top:20px; display:inline-block;}
        .score-board { font-size: 1.2em; font-weight:bold; margin: 15px 0;}
    </style>
</head>
<body>
    <!-- Game Sounds -->
    <audio id="eat-sound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
    <audio id="over-sound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>
    <audio id="level-sound" src="https://actions.google.com/sounds/v1/cartoon/woodpecker.ogg"></audio>

    <h1>SKY BLUE ARCADE</h1>
    <div class="level-text">LEVEL: <span id="level">1</span></div>
    
    <div class="score-board">SCORE: <span id="score">0</span> | HIGH SCORE: <span id="highscore">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p style="color:#555; font-size:1.2em; font-weight:bold;">Use Arrow Keys to Move. Har 5 score pe Level up hoga!</p>
    
    <a href="/dashboard" class="btn">⬅ Exit to HQ</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        
        const eatSound = document.getElementById("eat-sound");
        const overSound = document.getElementById("over-sound");
        const levelSound = document.getElementById("level-sound");

        let snake, food, score, level, d, gameSpeed, game;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        document.getElementById("highscore").innerText = highScore;

        function initSnake() {
            snake = []; snake[0] = { x: 9 * box, y: 10 * box };
            food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
            score = 0; level = 1; d = null; gameSpeed = 150;
            
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText = level;
            
            if(game) clearInterval(game);
            game = setInterval(draw, gameSpeed);
        }

        document.addEventListener("keydown", event => {
            if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if (event.keyCode == 38 && d != "DOWN") d = "UP";
            else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if (event.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            ctx.fillStyle = "#f0fcfd"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i == 0 ? "#0077b6" : "#00b4d8";
                ctx.fillRect(snake[i].x, snake[i].y, box-2, box-2);
            }
            ctx.fillStyle = "#e50914"; ctx.fillRect(food.x, food.y, box-2, box-2);

            if(!d) return;

            let snakeX = snake[0].x; let snakeY = snake[0].y;
            if (d == "LEFT") snakeX -= box; if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box; if (d == "DOWN") snakeY += box;

            // EAT FOOD
            if (snakeX == food.x && snakeY == food.y) {
                eatSound.play();
                score++;
                document.getElementById("score").innerText = score;
                food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
                
                // LEVEL UP LOGIC (Har 5 score pe level up, speed increase)
                if (score % 5 == 0) {
                    levelSound.play();
                    level++;
                    document.getElementById("level").innerText = level;
                    if (gameSpeed > 50) { 
                        clearInterval(game); 
                        gameSpeed -= 20; 
                        game = setInterval(draw, gameSpeed); 
                    }
                }
            } else { 
                snake.pop(); 
            }

            let newHead = { x: snakeX, y: snakeY };

            // GAME OVER
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                overSound.play();
                clearInterval(game);
                if(score > highScore) { localStorage.setItem("snakeHighScore", score); document.getElementById("highscore").innerText = score;}
                
                ctx.fillStyle = "rgba(229,9,20,0.8)"; ctx.fillRect(0, 150, 400, 100);
                ctx.fillStyle = "#fff"; ctx.font = "30px monospace"; ctx.fillText("GAME OVER!", 120, 210);
                
                setTimeout(initSnake, 3000); // 3 second baad auto restart
                return;
            }
            snake.unshift(newHead);
        }
        function collision(head, array) { for (let i = 0; i < array.length; i++) { if (head.x == array[i].x && head.y == array[i].y) return true; } return false; }
        
        initSnake();
    </script>
</body>
</html>
