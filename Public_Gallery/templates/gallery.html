<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ category }} Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #e0f7fa; color: #333; margin: 0; min-height:100vh;}
        header { padding: 20px; background: #fff; text-align: center; border-bottom: 3px solid #00b4d8; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}
        header h1 { color: #023e8a; margin: 0; }
        
        .upload-box { max-width: 650px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 15px; border: 2px solid #00b4d8; box-shadow: 0 10px 20px rgba(0,180,216,0.15);}
        input, textarea { width: 100%; padding: 12px; background: #f0fcfd; color: #333; border: 1px solid #90e0ef; border-radius: 8px; margin-bottom: 15px; font-family:inherit;}
        .btn { background: #0077b6; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; width: 100%; text-transform:uppercase;}
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .media-card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #caf0f8; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .media-card img, .media-card video { width: 100%; height: 250px; object-fit: cover; }
        .card-info { padding: 20px; }
        .card-info h3 { margin:0; color:#023e8a; font-size:1.4em;}

        .action-bar button { flex:1; background:#e0f7fa; color:#023e8a; border:1px solid #00b4d8; padding:10px; border-radius:5px; cursor:pointer; font-weight:bold;}
        .action-bar button:hover { background:#00b4d8; color:white; }

        /* Mascot & AI */
        .mascot-container { position: fixed; bottom: 30px; left: 30px; cursor: pointer; animation: float 3s infinite ease-in-out; }
        .mascot { font-size: 55px; }
        @keyframes float { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-15px);} }
        
        .ai-chat-box { display: none; position: fixed; bottom: 100px; left: 30px; width: 300px; background: #fff; border: 2px solid #00b4d8; border-radius: 15px; padding: 15px; box-shadow: 0 10px 30px rgba(0,180,216,0.3); z-index:999;}
        .ai-messages { height: 200px; overflow-y: auto; color: #333; font-size: 0.9em; margin-bottom: 10px;}
        .bot { background: #e0f7fa; padding: 10px; border-radius: 8px; border-left: 4px solid #00b4d8; margin-bottom:5px;}
        .user { background: #0077b6; color:white; padding: 10px; border-radius: 8px; text-align:right; margin-bottom:5px;}
    </style>
</head>
<body>
    <!-- Sound Effects -->
    <audio id="ui-sound" src="https://actions.google.com/sounds/v1/ui/button_click.ogg"></audio>
    <audio id="like-sound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
    <audio id="mascot-sound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

    <div class="mascot-container" onclick="toggleAI()">
        <div class="mascot">🤖</div>
    </div>

    <div class="ai-chat-box" id="ai-chat">
        <h3 style="margin-top:0; color:#023e8a;">VAULT A.I. ✖</h3>
        <div class="ai-messages" id="ai-messages"><p class="bot">Namaste! Sky Blue theme kaisa laga? Boliye kya help karu?</p></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="ai-input" placeholder="Type here..." style="margin:0; padding:10px; border-color:#00b4d8;">
            <button class="btn" style="width:auto;" onclick="sendAI()">➤</button>
        </div>
    </div>

    <header>
        <h1>{{ category }} <span>VAULT</span></h1>
        <a href="/dashboard" style="color:#0077b6; font-weight:bold; text-decoration:none;">⬅ Back</a>
    </header>

    <div class="upload-box">
        <form action="/gallery/{{ category }}" method="POST" enctype="multipart/form-data" onsubmit="playClick()">
            <h2 style="color:#023e8a; margin-top:0;">Upload to {{ category }}</h2>
            <input type="text" name="title" placeholder="Title" required>
            <input type="file" name="media" required style="background:white;">
            <button type="submit" class="btn">Submit for Admin Approval</button>
        </form>
    </div>

    <div class="gallery">
        {% for item in media_files %}
            <div class="media-card">
                {% if item.category == 'Video' %}<video controls><source src="{{ url_for('static', filename='uploads/' + item.filename) }}"></video>
                {% else %}<img src="{{ url_for('static', filename='uploads/' + item.filename) }}">{% endif %}
                <div class="card-info">
                    <h3>{{ item.title }}</h3>
                    <p style="color:#777; font-size:0.8em;">Uploaded by: {{ item.uploaded_by }}</p>
                    <div class="action-bar" style="display:flex; gap:10px; margin-top:15px;">
                        <button onclick="likeMedia({{ item.id }})">🔥 <span id="like-{{ item.id }}">{{ item.likes }}</span></button>
                        <button onclick="playClick(); navigator.clipboard.writeText(window.location.href); alert('Link Copied!');">🔗 Share</button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

    <script>
        function playClick() { document.getElementById('ui-sound').play(); }
        function toggleAI() { 
            document.getElementById('mascot-sound').play();
            let b = document.getElementById('ai-chat'); 
            b.style.display = b.style.display === 'block' ? 'none' : 'block'; 
        }
        
        function sendAI() {
            playClick();
            let input = document.getElementById('ai-input');
            let msgs = document.getElementById('ai-messages');
            if(!input.value) return;
            msgs.innerHTML += `<p class="user">${input.value}</p>`;
            let query = input.value; input.value = ''; msgs.scrollTop = msgs.scrollHeight;
            
            fetch('/api/ai', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query: query}) })
            .then(res => res.json()).then(data => {
                msgs.innerHTML += `<p class="bot">${data.reply}</p>`;
                msgs.scrollTop = msgs.scrollHeight;
            });
        }

        function likeMedia(id) {
            document.getElementById('like-sound').play();
            fetch('/like/' + id, { method: 'POST' }).then(res => res.json())
            .then(data => { document.getElementById('like-' + id).innerText = data.likes; });
        }
    </script>
</body>
</html>
