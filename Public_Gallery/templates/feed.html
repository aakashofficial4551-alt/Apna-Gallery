{% extends "base.html" %}
{% block title %}Feed | PHANTX{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding-bottom: 80px;">
    
    <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; border-bottom: 1px solid var(--accent-light); padding-bottom: 10px;">
        <a href="{{ url_for('feed', tab='foryou') }}" style="text-decoration: none; color: {% if current_tab == 'foryou' %}var(--text-primary){% else %}var(--text-secondary){% endif %}; font-weight: 800; font-size: 1.1rem; {% if current_tab == 'foryou' %}border-bottom: 3px solid var(--accent-primary);{% endif %}">
            Following
        </a>
        <a href="{{ url_for('feed', tab='global') }}" style="text-decoration: none; color: {% if current_tab == 'global' %}var(--text-primary){% else %}var(--text-secondary){% endif %}; font-weight: 800; font-size: 1.1rem; {% if current_tab == 'global' %}border-bottom: 3px solid var(--accent-primary);{% endif %}">
            Global Hub
        </a>
    </div>

    <!-- INFINITE SCROLL CONTAINER -->
    <div id="feed-container" style="display: flex; flex-direction: column; gap: 25px;">
        <!-- JS injects here -->
    </div>
    
    <div id="loading-spinner" style="text-align: center; padding: 20px; display: none;">
        <span style="font-size: 1.5rem; display: inline-block; animation: spin 1s infinite linear;">⚙️</span>
    </div>
</div>

<!-- 💥 THE NEW FLOATING UPLOAD BUTTON 💥 -->
<a href="#" onclick="openUploadModal()" class="floating-upload-btn" title="Upload Post">+</a>

<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

<script>
let offset = 0;
let loading = false;
let hasMore = true;
const currentTab = '{{ current_tab }}';
const csrfToken = '{{ csrf_token() }}';
const currentUser = '{{ session.username }}';

function createPostHTML(post) {
    const verifiedBadge = post.is_verified ? '<span style="color: #00b4d8; font-size: 0.9rem;">✅</span>' : '';
    const avatarUrl = post.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${post.uploaded_by}&backgroundColor=e0f7fa`;

    let mediaHtml = '';
    if(post.category === 'Photo') {
        mediaHtml = `<img src="${post.filename}" style="width: 100%; max-height: 500px; object-fit: contain; background: #000;">`;
    } else if(post.category === 'Video') {
        mediaHtml = `<video src="${post.filename}" controls style="width: 100%; max-height: 500px; background: #000;"></video>`;
    }

    // 💥 Notice the id="post-${post.id}" for Explore anchor links 💥
    return `
    <div id="post-${post.id}" style="background: var(--surface); border: 1px solid var(--accent-light); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);">
        
        <!-- COMPACT HEADER -->
        <div style="padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/agent/${post.uploaded_by}" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                <img src="${avatarUrl}" class="post-header-avatar" style="border-radius: 50%; border: 2px solid var(--accent-primary);">
                <div>
                    <h4 style="margin: 0; font-size: 1rem; color: var(--text-primary);">${post.nickname || post.uploaded_by} ${verifiedBadge}</h4>
                    <span style="font-size: 0.75rem; color: var(--text-tertiary);">${post.created_at}</span>
                </div>
            </a>
            ${post.uploaded_by !== currentUser ? `<button class="compact-action-btn" onclick="reportAsset(${post.id})" style="border:none; font-size:1.2rem;">🚩</button>` : ''}
        </div>

        <!-- MEDIA -->
        <div style="width: 100%; cursor: pointer;" onclick="handleDoubleTap(${post.id}, this)">
            ${mediaHtml}
        </div>

        <!-- COMPACT ACTION BAR & CONTENT -->
        <div style="padding: 12px 15px;">
            <h4 style="margin: 0 0 10px 0; font-size: 1.05rem; color: var(--text-primary);">${post.title}</h4>
            
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button id="like-btn-${post.id}" class="compact-action-btn" onclick="toggleLike(${post.id})" style="color: var(--danger); border-color: var(--danger);">
                    ❤️ <span id="like-count-${post.id}">${post.likes}</span>
                </button>
                
                ${post.uploaded_by !== currentUser ? `
                <button class="compact-action-btn" onclick="tipCreator(${post.id}, '${post.uploaded_by}')" style="color: var(--warning); border-color: var(--warning); background: rgba(255,152,0,0.1);">
                    🪙 Tip <span id="tip-count-${post.id}">${post.tips_received || 0}</span>
                </button>` : ''}
                
                <button class="compact-action-btn" onclick="document.getElementById('comment-input-${post.id}').focus()">
                    💬 Comment
                </button>
            </div>

            <!-- COMPACT COMMENTS -->
            <form method="POST" action="/add_comment/${post.id}" style="display: flex; gap: 8px; margin-top: 12px;">
                <input type="hidden" name="csrf_token" value="${csrfToken}">
                <input type="text" name="comment_text" id="comment-input-${post.id}" placeholder="Add a comment..." required style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--accent-light); outline:none;">
                <button type="submit" class="btn" style="padding: 8px 12px; font-size: 12px;">Post</button>
            </form>
        </div>
    </div>`;
}

async function loadMorePosts() {
    if (loading || !hasMore) return;
    loading = true; document.getElementById('loading-spinner').style.display = 'block';
    try {
        const response = await fetch(`/api/feed_data?tab=${currentTab}&offset=${offset}`);
        const newPosts = await response.json();
        if (newPosts.length === 0) { hasMore = false; } 
        else {
            const container = document.getElementById('feed-container');
            newPosts.forEach(post => container.insertAdjacentHTML('beforeend', createPostHTML(post)));
            offset += newPosts.length;
        }
    } catch (e) { console.error(e); }
    document.getElementById('loading-spinner').style.display = 'none';
    loading = false;
}

window.addEventListener('scroll', () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) loadMorePosts(); });
document.addEventListener("DOMContentLoaded", loadMorePosts);

async function toggleLike(mediaId) {
    try {
        const res = await fetch(`/like/${mediaId}`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
        const data = await res.json();
        if (res.ok) document.getElementById(`like-count-${mediaId}`).innerText = data.likes;
    } catch (e) {}
}

async function tipCreator(mediaId, creator) {
    if(confirm(`Send 10 🪙 from Wallet to ${creator}?`)) {
        try {
            const res = await fetch(`/tip/${mediaId}`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
            const data = await res.json();
            if (res.ok && data.success) { document.getElementById(`tip-count-${mediaId}`).innerText = data.new_tips; alert(`Sent 10 Coins! 🎉`); } 
            else { alert(data.error); }
        } catch (e) {}
    }
}

async function reportAsset(mediaId) {
    if(confirm("Report this post?")) {
        try {
            const res = await fetch(`/report/${mediaId}`, { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
            if (res.ok) alert("Post reported.");
        } catch (e) {}
    }
}

let lastTap = 0;
function handleDoubleTap(mediaId, element) {
    const tapLength = new Date().getTime() - lastTap;
    if (tapLength < 500 && tapLength > 0) toggleLike(mediaId);
    lastTap = new Date().getTime();
}
</script>
{% endblock %}
