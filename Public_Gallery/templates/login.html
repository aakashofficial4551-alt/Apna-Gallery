<!DOCTYPE html>
<html lang="en">
<head>
    <title>Enter The Vault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; }
        .login-box { text-align: center; background: #111; padding: 50px; border-radius: 10px; border: 1px solid #e50914; animation: glow 3s infinite; max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1 style="margin: 0; font-size: 2.5em; letter-spacing: 3px;">SOCHO KYA <span style="color:#e50914;">HOGA</span></h1>
        <p style="color:#aaa; margin-bottom: 30px;">Identify yourself to enter the vault.</p>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Agent Name" required autocomplete="off">
            <input type="number" name="age" placeholder="Agent Age" required>
            <button type="submit" class="btn">Enter Vault</button>
        </form>
    </div>
</body>
</html>
