{% extends "base.html" %}

{% block title %}Authentication | Apna Gallery{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto; background: var(--bg-card); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;">
    
    <h1 style="color: var(--accent); margin-top: 0;">Vault Access</h1>
    
    <!-- LOGIN FORM -->
    <form method="POST" id="loginForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="login" id="authAction">
        
        <input type="text" name="username" placeholder="Username or Email" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(8,17,31,0.6); color: white; outline: none; box-sizing: border-box;">
        
        <input type="email" name="email" id="emailField" placeholder="Email Address (Required for Recovery)" style="display: none; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(8,17,31,0.6); color: white; outline: none; box-sizing: border-box;">
        
        <input type="password" name="password" id="passField" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(8,17,31,0.6); color: white; outline: none; box-sizing: border-box;">
        
        <input type="password" name="confirm_password" id="confirmField" placeholder="Confirm Password" style="display: none; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(8,17,31,0.6); color: white; outline: none; box-sizing: border-box;">
        
        <button type="submit" id="mainBtn" class="btn" style="width: 100%; font-size: 1.1rem; padding: 12px; margin-bottom: 15px;">Login</button>
    </form>

    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 20px;">
        <a href="#" onclick="toggleMode('register')" style="color: var(--text-muted);">New? Register</a>
        <a href="#" onclick="toggleMode('forgot')" style="color: var(--warning);">Forgot Password?</a>
    </div>
    
    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 20px;">
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="guest">
        <button type="submit" class="btn" style="width: 100%; background: #334155; color: white;">Continue as Guest</button>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">Guest accounts auto-delete after 30 days of inactivity.</p>
    </form>
</div>

<script>
    function toggleMode(mode) {
        document.getElementById('authAction').value = mode;
        if(mode === 'register') {
            document.getElementById('emailField').style.display = 'block';
            document.getElementById('emailField').required = true;
            document.getElementById('confirmField').style.display = 'block';
            document.getElementById('confirmField').required = true;
            document.getElementById('passField').style.display = 'block';
            document.getElementById('mainBtn').innerText = 'Register Now';
        } else if (mode === 'forgot') {
            document.getElementById('emailField').style.display = 'block';
            document.getElementById('emailField').required = true;
            document.getElementById('confirmField').style.display = 'none';
            document.getElementById('passField').style.display = 'none';
            document.getElementById('passField').required = false;
            document.getElementById('mainBtn').innerText = 'Send OTP';
            document.getElementById('mainBtn').style.background = 'var(--warning)';
        }
    }
</script>
{% endblock %}
