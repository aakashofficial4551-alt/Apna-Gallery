{% extends "base.html" %}
{% block title %}Global Chat | PHANTX{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; padding-top: 10px; padding-bottom: 140px;">
    <h2 style="color: var(--text-primary); margin-bottom: 15px; text-align: center; font-weight: 900;">🌍 GLOBAL HUB</h2>
    
    <!-- CHAT MESSAGES AREA -->
    <div id="chat-box" style="height: 65vh; overflow-y: auto; background: var(--surface); padding: 15px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;">
        <!-- Chats will load here via JS -->
    </div>

    <!-- 💥 CHAT SEND FORM (Fixed to bottom, above Mobile Nav) 💥 -->
    <div class="chat-input-area" style="position: fixed; bottom: 70px; left: 0; width: 100%; background: var(--surface-glass); backdrop-filter: blur(15px); padding: 12px 20px; z-index: 9999; border-top: 1px solid var(--border-color);">
        <form method="POST" action="/global_chat" style="display: flex; gap: 10px; max-width: 800px; margin: 0 auto;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="message" placeholder="Type a message..." required class="form-input" style="flex: 1; border-radius: 30px; background: var(--bg-base); border: 1px solid var(--border-color); color: white; padding: 12px 20px;" autocomplete="off">
            <button type="submit" class="btn" style="border-radius: 30px; padding: 12px 25px;">Send</button>
        </form>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    let isFirstLoad = true;

    function fetchChats() {
        fetch('/api/global_chat_history')
            .then(res => res.json())
            .then(data => {
                let isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;
                chatBox.innerHTML = '';
                data.forEach(msg => {
                    let isMe = msg.sender === '{{ session.username }}';
                    chatBox.innerHTML += `
                    <div style="background: ${isMe ? 'var(--accent-primary)' : 'var(--border-color)'}; color: ${isMe ? '#000' : 'var(--text-primary)'}; padding: 12px 16px; border-radius: 20px; max-width: 85%; align-self: ${isMe ? 'flex-end' : 'flex-start'}; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        ${!isMe ? `<small style="color: var(--accent-primary); font-weight: 900; font-size: 0.75rem; display: block; margin-bottom: 4px;">@${msg.sender}</small>` : ''}
                        <span style="font-weight: 600; font-size: 0.95rem;">${msg.message}</span>
                    </div>`;
                });
                if (isScrolledToBottom || isFirstLoad) {
                    chatBox.scrollTop = chatBox.scrollHeight;
                    isFirstLoad = false;
                }
            });
    }
    setInterval(fetchChats, 2000); // Fast 2-second refresh
    fetchChats();
</script>
{% endblock %}
